[package]
name = "rust-duty-launcher"
version = "0.1.0"
edition = "2021"
default-run = "rust-duty-launcher"
license = "MIT"
description = "GitHub HTTPS, resumable, copy/add delta updater for RHS059/rust_duty"

[dependencies]
ed25519-dalek = "2.2"
fs2 = "0.4"
getrandom = "0.2"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
semver = { version = "1.0", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.23"
thiserror = "2.0"
zeroize = "1.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = "thin"
strip = true
