[package]
name = "rust-duty-launcher"
version = "0.1.0"
edition = "2021"
default-run = "rust-duty-launcher"
license = "MIT"
description = "Signed, resumable, copy/add delta updater for RHS059/rust_duty"

[dependencies]
ed25519-dalek = "2.2"
fs2 = "0.4"
getrandom = "0.2"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
semver = { version = "1.0", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.23"
thiserror = "2.0"
zeroize = "1.8"

[profile.release]
lto = "thin"
strip = true
