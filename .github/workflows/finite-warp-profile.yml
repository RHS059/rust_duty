name: Corroborate pinned finite Windows WARP profile

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finite-warp-profile.yml'
      - 'tools/run_finite_warp_profile.py'
      - 'tools/test_run_finite_warp_profile.py'
      - 'tools/prepare_finite_probe_inputs.py'
      - 'tools/test_prepare_finite_probe_inputs.py'
      - 'examples/finite_warp_probe.rs'
      - 'src/render/finite_warp_probe.rs'

permissions:
  contents: read
  actions: read

concurrency:
  group: finite-warp-profile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  corroborate:
    if: >-
      github.repository == 'RHS059/rust_duty' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      github.run_attempt == 1
    runs-on: windows-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Preserve the exact published source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: verifier
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/finite-warp-profile.yml
            /.github/workflows/native-profile-evidence.yml
            /tools/*.py
            /examples/source_visibility_geometry_probe.rs
            /examples/source_visibility_geometry/domain.rs
            /examples/finite_warp_probe.rs
            /src/render/finite_warp_probe.rs
            /src/render/mesh.rs
            /src/render/mod.rs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded arithmetic test dependencies
        run: python -m pip install numpy==2.2.6 PyYAML==6.0.3 Pillow==11.3.0
      - name: Check provider, restoration and runner guards before retrieval
        working-directory: verifier
        env:
          PYTHONPATH: tools
        run: >-
          python -m unittest -v test_extract_native_profile_evidence
          test_prepare_finite_probe_inputs test_run_finite_warp_profile
      - name: Read only the pinned successful provider metadata
        uses: actions/github-script@v7
        with:
          retries: 0
          script: |
            const fs = require('fs');
            if (context.repo.owner !== 'RHS059' || context.repo.repo !== 'rust_duty') {
              throw new Error('Unexpected repository');
            }
            const artifact = await github.rest.actions.getArtifact({
              ...context.repo, artifact_id: 11396831337
            });
            const attempt = await github.rest.actions.getWorkflowRunAttempt({
              ...context.repo, run_id: 37427554951, attempt_number: 1
            });
            fs.mkdirSync('provider', {recursive: true});
            fs.writeFileSync('provider/original-source.json',
              JSON.stringify({artifact: artifact.data, attempt: attempt.data}) + '\n', {flag: 'wx'});
      - name: Verify exact artifact, repository, commit, run and successful attempt
        run: >-
          python verifier/tools/prepare_finite_probe_inputs.py verify-provider
          --provider-metadata provider/original-source.json --verifier-root verifier
      # This is the only historical download. No listing, name fallback or rerun route.
      - name: Download only the independently verified original artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: RHS059/rust_duty
          run-id: '37427554951'
          artifact-ids: '11396831337'
          merge-multiple: true
          path: downloaded/original-source
      - name: Restore the pinned original inputs with reviewed diagnostic overlays
        id: prepare
        run: >-
          python verifier/tools/prepare_finite_probe_inputs.py prepare
          --packet-root downloaded/original-source/evidence/source-oracle/packet
          --provider-metadata provider/original-source.json --verifier-root verifier
          --output-dir prepared
      - name: Install the exact original Windows compiler
        run: rustup toolchain install 1.99.0-x86_64-pc-windows-msvc --profile minimal
      - name: Run source comparisons and the bounded later WARP corroboration
        run: >-
          python verifier/tools/run_finite_warp_profile.py
          --packet-root downloaded/original-source/evidence/source-oracle/packet
          --provider-metadata provider/original-source.json --verifier-root verifier
          --prepared-root prepared --receipt-sha256 "${{ steps.prepare.outputs.receipt_sha256 }}"
          --output-dir evidence/finite-warp
      - name: Retain all fresh traces, process logs and native observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finite-warp-later-full-attempt-${{ github.run_attempt }}
          path: evidence/finite-warp/full/
          if-no-files-found: error
          compression-level: 6
          retention-days: 7
      - name: Retain the bounded summary, logs and coverage PNGs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finite-warp-later-review-attempt-${{ github.run_attempt }}
          path: evidence/finite-warp/review/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
