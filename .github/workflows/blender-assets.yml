name: Export canonical Blender animations
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    name: Blender to FBX to validated runtime assets
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install pinned official Blender 4.3.2
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-6 libxi6 libxfixes3 libxrender1 libxkbcommon0 libgl1 libegl1
          curl --fail --location --retry 3 https://download.blender.org/release/Blender4.3/blender-4.3.2-linux-x64.tar.xz --output "$RUNNER_TEMP/blender.tar.xz"
          echo '4da1c956673c0485e63054e563ee69198cc8f80d8157dd7592dffc8a6a5592e6'"  $RUNNER_TEMP/blender.tar.xz" | sha256sum --check --strict
          tar -xJf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/blender-4.3.2-linux-x64" >> "$GITHUB_PATH"
      - name: Install numerical verification dependencies
        run: python -m pip install -r tools/requirements-assets.txt numpy==2.2.6 scipy==1.15.3
      - name: Verify committed locomotion companions
        run: python tools/package_game.py verify --root .
      - name: Export selected full WIP Action to FBX and convert evaluated FBX
        run: python tools/build_blender_assets.py --blender blender --output build-assets
      - name: Build actual game CPU sampler
        run: cargo build --locked --release --no-default-features --example sample_viewmodel_clip
      - name: Compare generated runtime assets against immutable source witnesses
        run: python tools/verify_fbx_segment.py build-assets/reload/asset.vra build-assets/fbx/source-witnesses.npz --native-start 0 --clip reload_current_wip --sampler target/release/examples/sample_viewmodel_clip --report build-assets/reload/parity.json
      - name: Upload source and parity diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blender-export-diagnostics
          path: |
            build-assets/reload/*.json
            build-assets/fbx/export-manifest.json
          if-no-files-found: warn
      - name: Publish validated generated companions for this run only
        uses: actions/upload-artifact@v4
        with:
          name: generated-reload-runtime
          path: |
            build-assets/reload/asset.vra
            build-assets/reload/asset.vrs
            build-assets/reload/asset.vrm
            build-assets/reload/manifest.json
            build-assets/reload/export-manifest.json
            build-assets/reload/source.json
            build-assets/reload/parity.json
          if-no-files-found: error
