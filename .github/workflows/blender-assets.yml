name: Export canonical Blender animations
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    name: Blender to FBX to validated runtime assets
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reuse only exact-input validated reload output
        id: asset-cache
        uses: actions/cache@v4
        with:
          path: build-assets/reload
          key: reload-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('assets/source/reload/current.blend', 'assets/source/reload/source.json', 'assets/locomotion/asset.vra', 'tools/export_reload_wip_fbx.py', 'tools/import_fbx_viewmodel.py', 'tools/prone_camera_pair.py', 'tools/single_stack_fbx.py', 'tools/build_blender_assets.py', 'tools/check_generated_assets.py', 'tools/package_game.py', 'tools/merge_walk_clip.py', 'assets/animations.cfg', 'docs/ANIMATION_SLOTS.md', 'tools/vr*.py', 'tools/requirements-assets.txt', '.github/actions/setup-blender/action.yml', '.github/workflows/blender-assets.yml') }}
      - name: Install pinned asset toolchain on cache miss
        if: steps.asset-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup-blender
      - name: Verify committed locomotion companions
        run: python tools/package_game.py verify --root .
      - name: Export selected full WIP Action to FBX and convert evaluated FBX
        if: steps.asset-cache.outputs.cache-hit != 'true'
        run: python tools/build_blender_assets.py --blender blender --output build-assets
      - name: Revalidate source hashes and every cached or fresh companion
        run: python tools/check_generated_assets.py --kind reload --directory build-assets/reload
      - name: Archive this attempt - Upload source and conversion diagnostics
        if: always()
        id: archive_attempt_1
        uses: actions/upload-artifact@v4
        with:
          name: blender-export-diagnostics-attempt-${{ github.run_attempt }}
          path: |
            build-assets/reload/**/*.json
            build-assets/fbx/export-manifest.json
          if-no-files-found: warn
      - name: Upload source and conversion diagnostics
        if: ${{ (always()) && steps.archive_attempt_1.outcome == 'success' && steps.archive_attempt_1.outputs.artifact-id != '' }}
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: blender-export-diagnostics
          path: |
            build-assets/reload/**/*.json
            build-assets/fbx/export-manifest.json
          if-no-files-found: warn
      - name: Archive this attempt - Publish validated generated companions for this run only
        id: archive_attempt_2
        uses: actions/upload-artifact@v4
        with:
          name: generated-reload-runtime-attempt-${{ github.run_attempt }}
          path: |
            build-assets/reload/asset.vra
            build-assets/reload/asset.vrs
            build-assets/reload/asset.vrm
            build-assets/reload/manifest.json
            build-assets/reload/export-manifest.json
            build-assets/reload/source.json
            build-assets/reload/alternates/*/asset.vra
            build-assets/reload/alternates/*/asset.vrs
            build-assets/reload/alternates/*/asset.vrm
            build-assets/reload/alternates/*/*.json
          if-no-files-found: error
      - name: Publish validated generated companions for this run only
        if: ${{ (success()) && steps.archive_attempt_2.outcome == 'success' && steps.archive_attempt_2.outputs.artifact-id != '' }}
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: generated-reload-runtime
          path: |
            build-assets/reload/asset.vra
            build-assets/reload/asset.vrs
            build-assets/reload/asset.vrm
            build-assets/reload/manifest.json
            build-assets/reload/export-manifest.json
            build-assets/reload/source.json
            build-assets/reload/alternates/*/asset.vra
            build-assets/reload/alternates/*/asset.vrs
            build-assets/reload/alternates/*/asset.vrm
            build-assets/reload/alternates/*/*.json
          if-no-files-found: error
