name: Rust prototype checks and playable builds
on:
  pull_request:
  push:
    branches: [main, 'aella/**', 'halcyon/**']
permissions:
  contents: read
jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-game-cargo-${{ hashFiles('Cargo.lock') }}
      - name: Linux audio headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/requirements-assets.txt cryptography
      - name: Verify required locomotion companions
        run: python tools/package_game.py verify --root .
      - run: python -m unittest discover -s tools -p "test_*.py" -v
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release
      - name: Fetch updater dependencies for required notices
        run: cargo fetch --manifest-path updater/Cargo.toml --locked
      - name: Generate required updater dependency notices
        run: python tools/collect_updater_licenses.py
      - name: Stage complete Windows game
        if: runner.os == 'Windows'
        run: python tools/package_game.py stage --root . --binary target/release/vector-range.exe --output dist/game
      - name: Stage complete Linux game
        if: runner.os == 'Linux'
        run: python tools/package_game.py stage --root . --binary target/release/vector-range --output dist/game
      - name: Upload complete Windows game
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: vector-range-windows-x64
          path: dist/game/
          if-no-files-found: error
      - name: Upload complete Linux game
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: vector-range-linux-x64
          path: dist/game/
          if-no-files-found: error
