name: Rust prototype checks and playable builds
on:
  pull_request:
  push:
    branches: [main, 'aella/**', 'halcyon/**']
permissions:
  contents: read
jobs:
  animation-assets:
    uses: ./.github/workflows/blender-assets.yml
  build:
    needs: animation-assets
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Fetch validated animation companions from this run
        uses: actions/download-artifact@v4
        with:
          name: generated-reload-runtime
          path: assets/reload
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-game-cargo-${{ hashFiles('Cargo.lock') }}
      - name: Linux audio headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/requirements-assets.txt cryptography
      - name: Verify required locomotion companions
        run: python tools/package_game.py verify --root . --require-generated
      - run: python -m unittest discover -s tools -p "test_*.py" -v
      - name: Format and capture required source changes
        shell: bash
        run: |
          cargo fmt --all
          git diff --binary > rustfmt.patch
      - name: Upload formatter patch for review
        uses: actions/upload-artifact@v4
        with:
          name: rustfmt-${{ runner.os }}
          path: rustfmt.patch
      - name: Compile lint checks on formatted tree
        run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
        env:
          RUST_DUTY_ANIMATION_MANIFEST: assets/animations.cfg
      - name: Require formatting committed to source
        run: git diff --exit-code -- src tests examples benches
      - run: cargo build --locked --release
      - name: Fetch updater dependencies for required notices
        run: cargo fetch --manifest-path updater/Cargo.toml --locked
      - name: Generate required updater dependency notices
        run: python tools/collect_updater_licenses.py
      - name: Stage complete Windows game
        if: runner.os == 'Windows'
        run: python tools/package_game.py stage --root . --binary target/release/vector-range.exe --output dist/game --require-generated
      - name: Stage complete Linux game
        if: runner.os == 'Linux'
        run: python tools/package_game.py stage --root . --binary target/release/vector-range --output dist/game --require-generated
      - name: Upload complete Windows game
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: vector-range-windows-x64
          path: dist/game/
          if-no-files-found: error
      - name: Upload complete Linux game
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: vector-range-linux-x64
          path: dist/game/
          if-no-files-found: error
