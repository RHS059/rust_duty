name: Rust prototype checks and playable builds
on:
  pull_request:
  push:
    branches: [main, 'aella/**']
permissions:
  contents: read
jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux audio headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/requirements-assets.txt
      - run: python -m unittest discover -s tools -p "test_*.py" -v
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release
      - name: Upload Windows executable
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: vector-range-windows-x64
          path: |
            target/release/vector-range.exe
            settings.cfg
            README.md
            LICENSE
            THIRD_PARTY_LICENSES.txt
            docs/PROVENANCE.md
            docs/ASSET_FORMAT.md
            docs/M4_PROFILE.md
            assets/README.md
            profiles/*.cfg
          if-no-files-found: error
      - name: Upload Linux executable
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: vector-range-linux-x64
          path: |
            target/release/vector-range
            settings.cfg
            README.md
            LICENSE
            THIRD_PARTY_LICENSES.txt
            docs/PROVENANCE.md
            docs/ASSET_FORMAT.md
            docs/M4_PROFILE.md
            assets/README.md
            profiles/*.cfg
          if-no-files-found: error
