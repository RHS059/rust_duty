name: Rust prototype checks and playable builds
on:
  pull_request:
  push:
    branches: [main, 'aella/**', 'halcyon/**', '!aella/release-channel']
permissions:
  contents: read
concurrency:
  group: game-${{ github.head_ref || github.ref_name }}-${{ github.ref == 'refs/heads/aella/automatic-game-updates-r1' && github.event_name || 'ci' }}
  # Push and PR runs for one branch share a lane; newest head replaces duplicate work.
  # Never interrupt an eligible push while it may be publishing a complete draft.
  cancel-in-progress: ${{ github.event_name != 'push' || github.ref != 'refs/heads/aella/automatic-game-updates-r1' }}
jobs:
  animation-assets:
    uses: ./.github/workflows/blender-assets.yml
  walk-assets:
    uses: ./.github/workflows/walk-assets.yml
  directional-assets:
    needs: [walk-assets]
    uses: ./.github/workflows/directional-assets.yml
  ads-assets:
    needs: [walk-assets]
    uses: ./.github/workflows/ads-assets.yml
  jump-assets:
    needs: [walk-assets]
    uses: ./.github/workflows/jump-assets.yml
  build:
    needs: [animation-assets, walk-assets, ads-assets, directional-assets, jump-assets]
    name: ${{ matrix.os }}
    # Build and artifact identity both use the checked-out Cargo.toml version.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Fetch validated animation companions from this run
        uses: actions/download-artifact@v4
        with:
          name: generated-reload-runtime
          path: assets/reload
      - name: Fetch freshly validated authored walking companions
        uses: actions/download-artifact@v4
        with:
          name: generated-walk-runtime
          path: assets/walk
      - name: Fetch source-authored ADS and preserved walking companions
        uses: actions/download-artifact@v4
        with:
          name: generated-ads-runtime
          path: assets/ads
      - name: Fetch four source-authored WIP HIP directional loops
        uses: actions/download-artifact@v4
        with:
          name: generated-directional-runtime
          path: assets/directional
      - name: Fetch source-authored common Jump r7 WIP
        uses: actions/download-artifact@v4
        with:
          name: generated-jump-runtime
          path: assets/jump
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            updater/target
          key: ${{ runner.os }}-game-cargo-v2-${{ hashFiles('Cargo.lock', 'updater/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-game-cargo-v2-${{ hashFiles('Cargo.lock', 'updater/Cargo.lock') }}-
            ${{ runner.os }}-game-cargo-${{ hashFiles('Cargo.lock') }}
      - name: Linux audio headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev xvfb xauth libgl1-mesa-dri
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Identify this exact build attempt
        id: identity
        shell: bash
        run: echo "label=$(python tools/build_identity.py --print-label)" >> "$GITHUB_OUTPUT"
      - run: python -m pip install -r tools/requirements-assets.txt cryptography
      - name: Materialize and verify all generated and committed companions
        run: python tools/package_game.py materialize --root . --include-walk --include-ads --include-directional --include-jump --require-generated
      - name: Format and capture required source changes
        shell: bash
        run: |
          cargo fmt --all
          git diff --binary > rustfmt.patch
      - name: Upload formatter patch for review
        uses: actions/upload-artifact@v4
        with:
          name: rustfmt-${{ runner.os }}
          path: rustfmt.patch
      - name: Require formatting committed to source
        run: git diff --exit-code -- build.rs src tests examples benches
      - name: Check run-attempt numbering primitive on both platforms
        shell: bash
        run: |
          rustc --test build_number.rs -o build-number-tests.exe
          ./build-number-tests.exe
      - name: Run full Python, game and updater checks in independent lanes
        run: python tools/ci_quality_checks.py
        env:
          RUST_DUTY_ANIMATION_MANIFEST: assets/animations.cfg
      - name: Retain every quality-check log and measured lane timing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-checks-${{ runner.os }}
          path: evidence/quality-checks/
          if-no-files-found: warn
      - name: Fetch updater dependencies for required notices
        run: cargo fetch --manifest-path updater/Cargo.toml --locked
      - name: Generate required updater dependency notices
        run: python tools/collect_updater_licenses.py
      - name: Stage complete Windows game
        if: runner.os == 'Windows'
        run: python tools/package_game.py stage --root . --binary target/release/vector-range.exe --output dist/game --require-generated
      - name: Stage complete Linux game
        if: runner.os == 'Linux'
        run: python tools/package_game.py stage --root . --binary target/release/vector-range --output dist/game --require-generated
      - name: Capture accepted common jumps and ADS/reload interruptions
        if: runner.os == 'Linux'
        timeout-minutes: 8
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          mkdir -p evidence/jump-gameplay
          cd dist/game
          timeout 420s xvfb-run -a -s "-screen 0 1920x1080x24" ./vector-range --no-update --reference-viewport --capture-sequence=gameplay-jump --capture-hz=60 --output=../../evidence/jump-gameplay
          cd ../..
          python tools/verify_jump_capture.py evidence/jump-gameplay
      - name: Retain native common Jump WIP evidence
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@v4
        with:
          name: native-gameplay-jump-evidence
          path: evidence/jump-gameplay/
          if-no-files-found: warn
      - name: Capture actual native gameplay reload and exit
        if: runner.os == 'Linux'
        timeout-minutes: 6
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          mkdir -p evidence/reload-gameplay
          cd dist/game
          timeout 300s xvfb-run -a -s "-screen 0 1920x1080x24" ./vector-range --no-update --reference-viewport --capture-sequence=gameplay-reload --output=../../evidence/reload-gameplay
          cd ../..
          python tools/verify_gameplay_capture.py evidence/reload-gameplay
      - name: Upload native gameplay frames and simulation evidence
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@v4
        with:
          name: native-gameplay-reload-evidence
          path: evidence/reload-gameplay/
          if-no-files-found: warn
      - name: Capture authored walking through committed gameplay movement
        if: runner.os == 'Linux'
        timeout-minutes: 6
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          mkdir -p evidence/walk-gameplay
          cd dist/game
          timeout 300s xvfb-run -a -s "-screen 0 1920x1080x24" ./vector-range --no-update --reference-viewport --capture-sequence=gameplay-walk --output=../../evidence/walk-gameplay
          cd ../..
          python tools/verify_gameplay_walk_capture.py evidence/walk-gameplay
      - name: Upload native authored walk frames and movement evidence
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@v4
        with:
          name: native-gameplay-walk-evidence
          path: evidence/walk-gameplay/
          if-no-files-found: warn
      - name: Capture authored ADS through committed input and interruptions
        if: runner.os == 'Linux'
        timeout-minutes: 12
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          mkdir -p evidence/ads-gameplay
          cd dist/game
          timeout 660s xvfb-run -a -s "-screen 0 1920x1080x24" ./vector-range --no-update --reference-viewport --capture-sequence=gameplay-ads --output=../../evidence/ads-gameplay
          cd ../..
          python tools/verify_gameplay_ads_capture.py evidence/ads-gameplay
      - name: Upload native authored ADS frames and interruption evidence
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@v4
        with:
          name: native-gameplay-ads-evidence
          path: evidence/ads-gameplay/
          if-no-files-found: warn
      - name: Verify saved XYZ placement recenters through native ADS
        if: runner.os == 'Linux'
        timeout-minutes: 12
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          mkdir -p evidence/ads-offset
          python -c "from pathlib import Path; Path('evidence/ads-offset.cfg').write_text(Path('dist/game/settings.cfg').read_text() + '\nviewmodel_x = 0.20\nviewmodel_y = -0.20\nviewmodel_z = 0.20\n')"
          cd dist/game
          timeout 660s xvfb-run -a -s "-screen 0 1920x1080x24" ./vector-range --no-update --reference-viewport --capture-sequence=gameplay-ads --settings=../../evidence/ads-offset.cfg --output=../../evidence/ads-offset
          cd ../..
          python tools/verify_ads_placement_capture.py evidence/ads-gameplay evidence/ads-offset > evidence/ads-offset-verification.json
      - name: Upload native ADS placement comparison
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@v4
        with:
          name: native-ads-placement-evidence
          path: |
            evidence/ads-offset/
            evidence/ads-offset.cfg
            evidence/ads-offset-verification.json
          if-no-files-found: warn
      - name: Capture layered direction input and interruption diagnostics at 30 and 60 Hz
        if: runner.os == 'Linux'
        timeout-minutes: 12
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          for hz in 30 60; do
            mkdir -p evidence/layered-$hz
            cd dist/game
            timeout 300s xvfb-run -a -s "-screen 0 1920x1080x24" ./vector-range --no-update --reference-viewport --capture-sequence=gameplay-layered --capture-hz=$hz --output=../../evidence/layered-$hz
            cd ../..
          done
          python tools/verify_layered_locomotion_capture.py evidence/layered-30 evidence/layered-60 > evidence/layered-rate-verification.json
      - name: Upload native layered input and sampling-rate evidence
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@v4
        with:
          name: native-layered-locomotion-evidence
          path: |
            evidence/layered-30/
            evidence/layered-60/
            evidence/layered-rate-verification.json
          if-no-files-found: warn
      - name: Capture reload return and interrupted live locomotion
        if: runner.os == 'Linux'
        timeout-minutes: 8
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          mkdir -p evidence/reload-return
          cd dist/game
          timeout 420s xvfb-run -a -s "-screen 0 1920x1080x24" ./vector-range --no-update --reference-viewport --capture-sequence=gameplay-return --capture-hz=60 --output=../../evidence/reload-return
          cd ../..
          python tools/verify_reload_return_capture.py evidence/reload-return
      - name: Upload native reload return evidence
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@v4
        with:
          name: native-reload-return-evidence
          path: evidence/reload-return/
          if-no-files-found: warn
      - name: Verify world-fixed lighting at frozen yaw and pitch poses
        if: runner.os == 'Linux'
        timeout-minutes: 6
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a -s "-screen 0 1920x1080x24" python tools/verify_lighting_capture.py evidence/lighting --binary dist/game/vector-range
      - name: Upload directional native lighting evidence
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@v4
        with:
          name: native-world-lighting-evidence
          path: evidence/lighting/
          if-no-files-found: warn
      - name: Verify embedded Windows build identity
        if: runner.os == 'Windows'
        run: python tools/build_identity.py --root dist/game --platform windows
      - name: Verify embedded Linux build identity
        if: runner.os == 'Linux'
        run: python tools/build_identity.py --root dist/game --platform linux
      - name: Upload uniquely numbered Windows game
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Rust-Duty-${{ steps.identity.outputs.label }}-Windows-x64
          path: dist/game/
          if-no-files-found: error
      - name: Upload uniquely numbered Linux game
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: Rust-Duty-${{ steps.identity.outputs.label }}-Linux-x64
          path: dist/game/
          if-no-files-found: error
      # Compatibility aliases are identical bytes for the existing release publisher.
      - name: Upload complete Windows game
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: vector-range-windows-x64
          path: dist/game/
          if-no-files-found: error
      - name: Upload complete Linux game
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: vector-range-linux-x64
          path: dist/game/
          if-no-files-found: error

  publish-game-update:
    name: Publish authorized one-time 0.1.5 game update
    needs: [build]
    if: >-
      github.repository == 'RHS059/rust_duty' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/aella/automatic-game-updates-r1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      # Shared with the legacy manual publisher; promotion cannot race.
      group: rust-duty-release-channel
      cancel-in-progress: false
    env:
      RUST_DUTY_BUILD_VERSION: '0.1.5'
      RUST_DUTY_BUILD_RESULT: ${{ needs.build.result }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch complete Windows game from this exact run
        uses: actions/download-artifact@v4
        with:
          name: vector-range-windows-x64
          path: tested/windows
      - name: Fetch complete Linux game from this exact run
        uses: actions/download-artifact@v4
        with:
          name: vector-range-linux-x64
          path: tested/linux
      - name: Publish one-time validated 0.1.5 game and update bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/publish_game_build.py --tested tested --output release-assets
      - name: Retain one-time publication provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: game-release-0.1.5-provenance
          path: release-assets/SOURCE_PROVENANCE.json
          if-no-files-found: warn

