name: Rust prototype checks and playable builds
on:
  pull_request:
  push:
    branches: [main, 'aella/**', 'halcyon/**', '!aella/release-channel']
permissions:
  contents: read
concurrency:
  group: game-${{ github.head_ref || github.ref_name }}-${{ github.ref == 'refs/heads/aella/automatic-game-updates-r1' && github.event_name || 'ci' }}
  # Push and PR runs for one branch share a lane; newest head replaces duplicate work.
  # Never interrupt an eligible push while it may be publishing a complete draft.
  cancel-in-progress: ${{ github.event_name != 'push' || github.ref != 'refs/heads/aella/automatic-game-updates-r1' }}
jobs:
  windows-source-bound-recovery:
    if: (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'aella/wgpu-renderer-port') || (github.event_name == 'push' && github.ref == 'refs/heads/aella/wgpu-renderer-port')
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/windows-source-bound-recovery.yml
  windows-same-platform-return:
    needs: [animation-assets, walk-assets, ads-assets, directional-assets, jump-assets]
    uses: ./.github/workflows/windows-same-platform-return.yml
  dx12-authored-validation:
    needs: [animation-assets, walk-assets, ads-assets, directional-assets, jump-assets, native-validation]
    uses: ./.github/workflows/wgpu-dx12-authored.yml
  animation-assets:
    uses: ./.github/workflows/blender-assets.yml
  walk-assets:
    uses: ./.github/workflows/walk-assets.yml
  directional-assets:
    needs: [walk-assets]
    uses: ./.github/workflows/directional-assets.yml
  ads-assets:
    needs: [walk-assets]
    uses: ./.github/workflows/ads-assets.yml
  jump-assets:
    needs: [walk-assets]
    uses: ./.github/workflows/jump-assets.yml
  native-validation:
    needs: [animation-assets, walk-assets, ads-assets, directional-assets, jump-assets]
    uses: ./.github/workflows/native-validation.yml
  dx12-warp-smoke:
    needs: [animation-assets, walk-assets, ads-assets, directional-assets, jump-assets]
    uses: ./.github/workflows/wgpu-dx12-smoke.yml
  dx12-renderer-contract:
    uses: ./.github/workflows/wgpu-renderer-contract.yml
  build:
    needs: [animation-assets, walk-assets, ads-assets, directional-assets, jump-assets]
    name: windows-latest
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch validated animation companions from this run
        uses: actions/download-artifact@v4
        with:
          name: generated-reload-runtime
          path: assets/reload
      - name: Fetch freshly validated authored walking companions
        uses: actions/download-artifact@v4
        with:
          name: generated-walk-runtime
          path: assets/walk
      - name: Fetch source-authored ADS and preserved walking companions
        uses: actions/download-artifact@v4
        with:
          name: generated-ads-runtime
          path: assets/ads
      - name: Fetch four source-authored WIP HIP directional loops
        uses: actions/download-artifact@v4
        with:
          name: generated-directional-runtime
          path: assets/directional
      - name: Fetch source-authored common Jump r7 WIP
        uses: actions/download-artifact@v4
        with:
          name: generated-jump-runtime
          path: assets/jump
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            updater/target
          key: ${{ runner.os }}-game-cargo-v2-${{ hashFiles('Cargo.lock', 'updater/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-game-cargo-v2-${{ hashFiles('Cargo.lock', 'updater/Cargo.lock') }}-
            ${{ runner.os }}-game-cargo-${{ hashFiles('Cargo.lock') }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Identify this exact build attempt
        id: identity
        shell: bash
        run: echo "label=$(python tools/build_identity.py --print-label)" >> "$GITHUB_OUTPUT"
      - run: python -m pip install -r tools/requirements-assets.txt cryptography
      - name: Materialize and verify all generated and committed companions
        run: python tools/package_game.py materialize --root . --include-walk --include-ads --include-directional --include-jump --require-generated
      - name: Format and capture required source changes
        shell: bash
        run: |
          cargo fmt --all
          git diff --binary > rustfmt.patch
      - name: Archive this attempt - Upload formatter patch for review
        id: archive_attempt_1
        uses: actions/upload-artifact@v4
        with:
          name: rustfmt-${{ runner.os }}-attempt-${{ github.run_attempt }}
          path: rustfmt.patch
      - name: Upload formatter patch for review
        if: ${{ (success()) && steps.archive_attempt_1.outcome == 'success' && steps.archive_attempt_1.outputs.artifact-id != '' }}
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: rustfmt-${{ runner.os }}
          path: rustfmt.patch
      - name: Require formatting committed to source
        run: git diff --exit-code -- build.rs src tests examples benches
      - name: Check run-attempt numbering primitive on Windows
        shell: bash
        run: |
          rustc --test build_number.rs -o build-number-tests.exe
          ./build-number-tests.exe
      - name: Run full Python, game and updater checks in independent lanes
        run: python tools/ci_quality_checks.py
        env:
          RUST_DUTY_ANIMATION_MANIFEST: assets/animations.cfg
      - name: Archive this attempt - Retain every quality-check log and measured lane timing
        if: always()
        id: archive_attempt_2
        uses: actions/upload-artifact@v4
        with:
          name: quality-checks-${{ runner.os }}-attempt-${{ github.run_attempt }}
          path: evidence/quality-checks/
          if-no-files-found: warn
      - name: Retain every quality-check log and measured lane timing
        if: ${{ (always()) && steps.archive_attempt_2.outcome == 'success' && steps.archive_attempt_2.outputs.artifact-id != '' }}
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: quality-checks-${{ runner.os }}
          path: evidence/quality-checks/
          if-no-files-found: warn
      - name: Fetch updater dependencies for required notices
        run: cargo fetch --manifest-path updater/Cargo.toml --locked
      - name: Generate required updater dependency notices
        run: python tools/collect_updater_licenses.py
      - name: Stage complete Windows game
        if: runner.os == 'Windows'
        run: python tools/package_game.py stage --root . --binary target/release/vector-range.exe --output dist/game --require-generated
      - name: Verify embedded Windows build identity
        if: runner.os == 'Windows'
        run: python tools/build_identity.py --root dist/game --platform windows
      - name: Prepare real Windows 0.1.9 to 0.1.11 update preflight
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p preflight/baseline
          gh release download v0.1.9 --repo RHS059/rust_duty --dir preflight/baseline \
            --pattern rust-duty-0.1.9-x86_64-pc-windows-msvc.rdb --pattern update-x86_64-pc-windows-msvc.json
          python tools/release_update.py verify --manifest preflight/baseline/update-x86_64-pc-windows-msvc.json \
            --assets-dir preflight/baseline --bundle-only --version 0.1.9 --target x86_64-pc-windows-msvc
          python tools/package_game.py stage --root dist/game --binary vector-range.exe \
            --output preflight/payload --update --require-generated
          python tools/release_update.py prepare --input preflight/payload --output preflight/candidate \
            --version 0.1.11 --sequence 11 --target x86_64-pc-windows-msvc --entrypoint vector-range.exe \
            --previous preflight/baseline/rust-duty-0.1.9-x86_64-pc-windows-msvc.rdb --previous-version 0.1.9
          python tools/release_update.py verify --manifest preflight/candidate/update-x86_64-pc-windows-msvc.json \
            --assets-dir preflight/candidate --version 0.1.11 --target x86_64-pc-windows-msvc
      - name: Real Windows update preflight - full
        timeout-minutes: 12
        run: python tools/run_preflight_case.py --case full
      - name: Real Windows update preflight - one-file
        timeout-minutes: 12
        run: python tools/run_preflight_case.py --case one-file
      - name: Real Windows update preflight - recover-one-file
        timeout-minutes: 12
        run: python tools/run_preflight_case.py --case recover-one-file
      - name: Real Windows update preflight - mismatch
        timeout-minutes: 12
        run: python tools/run_preflight_case.py --case mismatch
      - name: Real Windows update preflight - unusable
        timeout-minutes: 12
        run: python tools/run_preflight_case.py --case unusable
      - name: Real Windows update preflight - corrupt-delta
        timeout-minutes: 12
        run: python tools/run_preflight_case.py --case corrupt-delta
      - name: Archive immutable preflight evidence
        if: always()
        id: archive_preflight
        uses: actions/upload-artifact@v4
        with:
          name: windows-update-preflight-attempt-${{ github.run_attempt }}
          path: |
            evidence/preflight/*/progress.jsonl
            evidence/preflight/*/result.json
          if-no-files-found: warn
      - name: Upload uniquely numbered Windows game
        if: runner.os == 'Windows'
        id: archive_game_windows
        uses: actions/upload-artifact@v4
        with:
          name: Rust-Duty-${{ steps.identity.outputs.label }}-Windows-x64
          path: dist/game/
          if-no-files-found: error
      - name: Upload complete Windows game
        if: ${{ (runner.os == 'Windows') && steps.archive_game_windows.outcome == 'success' && steps.archive_game_windows.outputs.artifact-id != '' }}
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: vector-range-windows-x64
          path: dist/game/
          if-no-files-found: error

  publish-game-update:
    name: Publish authorized one-time 0.1.5 game update
    needs: [build]
    if: >-
      github.repository == 'RHS059/rust_duty' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/aella/automatic-game-updates-r1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      # Shared with the legacy manual publisher; promotion cannot race.
      group: rust-duty-release-channel
      cancel-in-progress: false
    env:
      RUST_DUTY_BUILD_VERSION: '0.1.5'
      RUST_DUTY_BUILD_RESULT: ${{ needs.build.result }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch complete Windows game from this exact run
        uses: actions/download-artifact@v4
        with:
          name: vector-range-windows-x64
          path: tested/windows
      - name: Publish one-time validated 0.1.5 game and update bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/publish_game_build.py --tested tested --output release-assets
      - name: Archive this attempt - Retain one-time publication provenance
        if: always()
        id: archive_attempt_15
        uses: actions/upload-artifact@v4
        with:
          name: game-release-0.1.5-provenance-attempt-${{ github.run_attempt }}
          path: release-assets/SOURCE_PROVENANCE.json
          if-no-files-found: warn

      - name: Retain one-time publication provenance
        if: ${{ (always()) && steps.archive_attempt_15.outcome == 'success' && steps.archive_attempt_15.outputs.artifact-id != '' }}
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: game-release-0.1.5-provenance
          path: release-assets/SOURCE_PROVENANCE.json
          if-no-files-found: warn

