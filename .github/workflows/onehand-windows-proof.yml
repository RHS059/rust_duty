name: Original-source Windows playable game delivery
on:
  pull_request:
    branches: [aella/combined-authored-transitions-20261016, aella/combined-diagnostic-source-wip-20261016, main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'tools/**'
      - 'src/**'
      - 'assets/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/onehand-windows-proof.yml'
permissions:
  contents: read
concurrency:
  group: onehand-windows-delivery-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  playable-game:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: windows-2022
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
      GIT_CONFIG_KEY_1: core.eol
      GIT_CONFIG_VALUE_1: lf
      PACKAGE: tools/onehand_windows/direct-delivery-v1
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
          architecture: 'x64'
      - name: Test direct delivery behavior
        run: |
          python -I -B (Join-Path $env:PACKAGE 'test_direct_delivery.py')
          if ($LASTEXITCODE -ne 0) { throw 'Direct delivery source tests failed' }
          python -I -B (Join-Path $env:PACKAGE 'test_direct_assets.py')
          if ($LASTEXITCODE -ne 0) { throw 'Ordinary asset packaging source tests failed' }
      - name: Initialize installed Microsoft compiler tools
        run: |
          $ErrorActionPreference='Stop'
          $vswhere=Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs=(& $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath).Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($vs)) { throw 'Installed MSVC unavailable' }
          & tools/onehand_windows/msvc-environment-v1/initialize_msvc.ps1 -DeveloperCommandPath (Join-Path $vs 'Common7/Tools/VsDevCmd.bat') -EnvironmentFile $env:GITHUB_ENV
      - name: Select official pinned Rust compiler
        run: |
          $ErrorActionPreference='Stop'
          $env:RUSTUP_DIST_SERVER='https://static.rust-lang.org'
          $env:RUSTUP_UPDATE_ROOT='https://static.rust-lang.org/rustup'
          rustup toolchain install 1.99.0-x86_64-pc-windows-msvc --profile minimal --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed' }
          $cargo=(& rustup which --toolchain 1.99.0-x86_64-pc-windows-msvc cargo).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Cargo path unavailable' }
          $rustc=(& rustup which --toolchain 1.99.0-x86_64-pc-windows-msvc rustc).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Rust compiler path unavailable' }
          "DELIVERY_CARGO=$cargo" >> $env:GITHUB_ENV
          "DELIVERY_RUSTC=$rustc" >> $env:GITHUB_ENV
      - name: Compile and package existing approved runtime exports
        id: delivery
        run: |
          $ErrorActionPreference='Stop'
          $work=Join-Path $env:RUNNER_TEMP ("onehand-direct-"+$env:GITHUB_RUN_ID+"-"+$env:GITHUB_RUN_ATTEMPT)
          python -I -B (Join-Path $env:PACKAGE 'run_delivery.py') --root $env:GITHUB_WORKSPACE --work $work --cargo $env:DELIVERY_CARGO --rustc $env:DELIVERY_RUSTC --source-commit $env:SOURCE_COMMIT --github-output $env:GITHUB_OUTPUT
          if ($LASTEXITCODE -ne 0) { throw 'Game compilation or packaging failed' }
      - name: Deliver playable Windows game
        uses: actions/upload-artifact@v4
        with:
          name: rust-duty-onehand-windows-game-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.delivery.outputs.delivery_root }}
          if-no-files-found: error
          retention-days: 7
      - name: Keep bounded build result
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: onehand-windows-delivery-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/onehand-direct-${{ github.run_id }}-${{ github.run_attempt }}/failure-summary.json
            ${{ runner.temp }}/onehand-direct-${{ github.run_id }}-${{ github.run_attempt }}/build-errors.txt
          if-no-files-found: ignore
          retention-days: 7
