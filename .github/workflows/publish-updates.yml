name: Legacy manual publisher retired
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  use-merged-release-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Explain the merged-PR release policy
        run: |
          echo 'Versions are allocated exactly once per PR merged into main.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Use Release every merged game PR; retry its original failed jobs for an existing allocation.' >> "$GITHUB_STEP_SUMMARY"
          echo 'The legacy release plan cannot allocate or publish another version.' >> "$GITHUB_STEP_SUMMARY"
          exit 1
