name: Publish Rust Duty game updates
on:
  workflow_dispatch:
  push:
    branches: ['aella/release-channel']
    paths: ['.github/release/plan.json']
permissions:
  contents: read
  actions: read
concurrency:
  group: rust-duty-release-channel
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'RHS059/rust_duty' && github.ref == 'refs/heads/aella/release-channel'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      game_ref: ${{ steps.plan.outputs.game_ref }}
      launcher_ref: ${{ steps.plan.outputs.launcher_ref }}
      previous: ${{ steps.plan.outputs.previous }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: plan
        name: Validate explicit release plan
        run: |
          python - <<'PY'
          import json, os, re
          p=json.load(open('.github/release/plan.json'))
          assert set(p)=={'enabled','version','sequence','previous','game_ref','launcher_ref'}
          assert p['enabled'] is True, 'Release plan is disabled'
          semver=r'(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)'
          assert re.fullmatch(semver,p['version'])
          assert type(p['sequence']) is int and p['sequence']>0
          assert p['previous']=='' or re.fullmatch(semver,p['previous'])
          for key in ['game_ref','launcher_ref']: assert re.fullmatch(r'[0-9a-f]{40}',p[key])
          if p['previous']:
              assert tuple(map(int,p['previous'].split('.')))<tuple(map(int,p['version'].split('.')))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              for k in ['version','game_ref','launcher_ref','previous']: f.write(f'{k}={p[k]}\n')
          with open(os.environ['GITHUB_ENV'],'a') as f:
              for k in ['version','sequence','previous','game_ref','launcher_ref']: f.write(f'RELEASE_{k.upper()}={p[k]}\n')
          PY
      - name: Select successful exact-source Windows jobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/select_windows_build.py
      - name: Download tested binaries without rebuilding them
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GAME_RUN_ID" --repo RHS059/rust_duty --name vector-range-windows-x64 --dir tested/windows/game
          gh run download "$LAUNCHER_RUN_ID" --repo RHS059/rust_duty --name rust-duty-launcher-windows --dir tested/windows/launcher
      - name: Curate complete game payloads and validate standalone launchers
        run: |
          python - <<'PY'
          from pathlib import Path
          import os, shutil, subprocess, sys
          for osname,game,launcher,bootstrap,magic in [
              ('windows','vector-range.exe','RustDuty.exe','RustDuty-windows-x64.exe',b'MZ')]:
              source=Path('tested')/osname
              assert (source/'launcher/BOOTSTRAP_TRUST.txt').read_text().strip()=='GITHUB_HTTPS_SHA256 RHS059/rust_duty'
              binary=source/'launcher'/launcher
              assert binary.read_bytes().startswith(magic)
              payload=Path('payload')/osname
              # Exact allowlist includes the three authorized locomotion companions.
              # Staging fails on missing/corrupt assets and never copies user settings.
              subprocess.run([sys.executable, 'tools/package_game.py', 'stage',
                  '--root', str(source/'game'), '--binary', game,
                  '--output', str(payload), '--update'], check=True)
              Path('release-assets').mkdir(exist_ok=True)
              complete=Path('complete')/osname
              subprocess.run([sys.executable, 'tools/package_game.py', 'stage',
                  '--root', str(source/'game'), '--binary', game,
                  '--output', str(complete)], check=True)
              label='Windows'
              archive=Path('release-assets')/f'Rust-Duty-{os.environ["RELEASE_VERSION"]}-{label}-x64'
              shutil.make_archive(str(archive), 'zip', root_dir=complete)
              shutil.copy2(binary,Path('release-assets')/bootstrap)
              # Retain the legacy migration executable alongside complete ZIPs.
              shutil.copy2(payload/game,Path('release-assets')/'vector-range.exe')
          shutil.copy2('SOURCE_PROVENANCE.json','release-assets/SOURCE_PROVENANCE.json')
          PY
      - name: Prepare full bundles and real retained-base deltas
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$RELEASE_PREVIOUS" ]; then
            count=$(gh api 'repos/RHS059/rust_duty/releases?per_page=100' --jq '[.[] | select(.draft == false) | .assets[]? | .name | select(startswith("update-") and endswith(".json"))] | length')
            test "$count" = 0 || { echo 'Existing channel requires previous version'; exit 1; }
          fi
          for platform in windows; do
            target=x86_64-pc-windows-msvc; game=vector-range.exe
            previous_args=()
            if [ -n "$RELEASE_PREVIOUS" ]; then
              mkdir -p "baseline/$platform"
              gh release download "v$RELEASE_PREVIOUS" --repo RHS059/rust_duty \
                --pattern "rust-duty-$RELEASE_PREVIOUS-$target.rdb" --pattern "update-$target.json" --dir "baseline/$platform"
              python tools/release_update.py verify --manifest "baseline/$platform/update-$target.json" \
                --assets-dir "baseline/$platform" --bundle-only --version "$RELEASE_PREVIOUS" --target "$target" > verified-baseline.json
              python -c 'import json,os; assert int(os.environ["RELEASE_SEQUENCE"])>json.load(open("verified-baseline.json"))["sequence"]'
              previous_args=(--previous "baseline/$platform/rust-duty-$RELEASE_PREVIOUS-$target.rdb" --previous-version "$RELEASE_PREVIOUS")
            fi
            python tools/release_update.py prepare --input "payload/$platform" --output release-assets \
              --version "$RELEASE_VERSION" --sequence "$RELEASE_SEQUENCE" --target "$target" --entrypoint "$game" "${previous_args[@]}"
            python tools/release_update.py verify --manifest "release-assets/update-$target.json" \
              --assets-dir release-assets --version "$RELEASE_VERSION" --target "$target"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: prepared-complete-game-update
          path: release-assets/
          if-no-files-found: error
  publish:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      GAME_REF: ${{ needs.prepare.outputs.game_ref }}
      LAUNCHER_REF: ${{ needs.prepare.outputs.launcher_ref }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: prepared-complete-game-update
          path: release-assets/
      - name: Publish immutable versioned assets atomically
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$RELEASE_VERSION"
          if gh release view "$tag" --repo RHS059/rust_duty > /dev/null 2>&1; then
            echo 'Version exists; refusing replacement'; exit 1
          fi
          mapfile -t assets < <(find release-assets -maxdepth 1 -type f | sort)
          test "${#assets[@]}" -ge 6
          gh release create "$tag" --repo RHS059/rust_duty --target "$GAME_REF" --draft \
            --title "Rust Duty $RELEASE_VERSION" \
            --notes "Complete game update with the frozen 43-clip locomotion companions and a standalone migration launcher. Trusts this GitHub repository over HTTPS and validates payload sizes/SHA256; no independent signing key. The exact authorized locomotion package is included; unrelated private models and user settings remain untouched. Game source: $GAME_REF. Launcher source: $LAUNCHER_REF."
          gh release upload "$tag" "${assets[@]}" --repo RHS059/rust_duty
          gh release edit "$tag" --repo RHS059/rust_duty --draft=false --latest

  smoke:
    needs: [prepare, publish]
    if: needs.prepare.outputs.previous != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            launcher: RustDuty-windows-x64.exe
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      PREVIOUS_VERSION: ${{ needs.prepare.outputs.previous }}
      RELEASE_TARGET: ${{ matrix.target }}
      LAUNCHER_ASSET: ${{ matrix.launcher }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download published baseline, expected manifest and launcher
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p baseline expected
          gh release download "v$PREVIOUS_VERSION" --repo RHS059/rust_duty \
            --pattern "rust-duty-$PREVIOUS_VERSION-$RELEASE_TARGET.rdb" \
            --pattern "update-$RELEASE_TARGET.json" --dir baseline
          gh release download "v$RELEASE_VERSION" --repo RHS059/rust_duty \
            --pattern "$LAUNCHER_ASSET" --pattern "update-$RELEASE_TARGET.json" --dir expected
      - name: Verify real GitHub delta activation and local preservation
        shell: bash
        timeout-minutes: 5
        run: |
          python tools/smoke_live_update.py \
            --launcher "expected/$LAUNCHER_ASSET" \
            --baseline-bundle "baseline/rust-duty-$PREVIOUS_VERSION-$RELEASE_TARGET.rdb" \
            --baseline-manifest "baseline/update-$RELEASE_TARGET.json" \
            --expected-manifest "expected/update-$RELEASE_TARGET.json" \
            --baseline-version "$PREVIOUS_VERSION" --expected-version "$RELEASE_VERSION" \
            --target "$RELEASE_TARGET" --report "live-update-$RELEASE_TARGET.json"
      - name: Check whether baseline contains the integrated game updater
        id: game-updater-baseline
        shell: bash
        run: |
          python - <<'PY'
          import os
          supported=tuple(map(int,os.environ['PREVIOUS_VERSION'].split('.'))) >= (0,1,2)
          with open(os.environ['GITHUB_OUTPUT'],'a') as stream:
              stream.write(f'available={str(supported).lower()}\n')
          PY
      - name: Verify actual game-entry update and same-path relaunch
        if: steps.game-updater-baseline.outputs.available == 'true'
        shell: bash
        timeout-minutes: 8
        run: |
          python tools/smoke_game_update.py \
            --launcher "expected/$LAUNCHER_ASSET" \
            --bundle-a "baseline/rust-duty-$PREVIOUS_VERSION-$RELEASE_TARGET.rdb" \
            --manifest-a "baseline/update-$RELEASE_TARGET.json" \
            --manifest-b "expected/update-$RELEASE_TARGET.json" \
            --version-a "$PREVIOUS_VERSION" --version-b "$RELEASE_VERSION" \
            --target "$RELEASE_TARGET" --report "game-update-$RELEASE_TARGET.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-update-evidence-${{ matrix.target }}
          path: |
            live-update-${{ matrix.target }}.json
            game-update-${{ matrix.target }}.json
          if-no-files-found: warn
