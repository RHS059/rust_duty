name: Native authored resident GPU correctness
on:
  push:
    branches: [aella/wgpu-1080p-diagnostics]
    paths:
      - '.github/workflows/resident-authored-contract.yml'
      - '.github/workflows/blender-assets.yml'
      - '.github/workflows/walk-assets.yml'
      - '.github/workflows/ads-assets.yml'
      - '.github/workflows/directional-assets.yml'
      - '.github/workflows/jump-assets.yml'
      - 'examples/renderer_contract.rs'
      - 'examples/pass_submission_benchmark.rs'
      - 'examples/gpu_session_contract.rs'
      - 'examples/authored_loader_contract.rs'
      - 'examples/resident_authored_contract.rs'
      - 'assets/**'
      - 'tools/**'
      - 'src/**'
      - 'updater/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - 'build_number.rs'
      - 'rust-toolchain.toml'
      - 'rust-toolchain'
      - '.cargo/**'
      - '.gitattributes'
      - 'LICENSE'
      - 'THIRD_PARTY_LICENSES.txt'
permissions:
  contents: read
concurrency:
  group: resident-authored-contract-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: 'false'
jobs:
  animation-assets:
    uses: ./.github/workflows/blender-assets.yml
  walk-assets:
    uses: ./.github/workflows/walk-assets.yml
  directional-assets:
    needs: [walk-assets]
    uses: ./.github/workflows/directional-assets.yml
  ads-assets:
    needs: [walk-assets]
    uses: ./.github/workflows/ads-assets.yml
  jump-assets:
    needs: [walk-assets]
    uses: ./.github/workflows/jump-assets.yml
  authored-resident:
    needs: [animation-assets, walk-assets, ads-assets, directional-assets, jump-assets]
    if: github.repository == 'RHS059/rust_duty' && github.ref == 'refs/heads/aella/wgpu-1080p-diagnostics'
    runs-on: windows-latest
    env:
      CARGO_HOME: ${{ github.workspace }}/.resident-authored-cargo
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/assets/weapons/
      - name: Install and select the exact comparison compiler binaries
        shell: pwsh
        run: |
          rustup toolchain install 1.99.0-x86_64-pc-windows-msvc --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Pinned compiler installation failed' }
          $rustc = rustup which --toolchain 1.99.0-x86_64-pc-windows-msvc rustc
          if ($LASTEXITCODE -ne 0) { throw 'Pinned compiler lookup failed' }
          # Direct binaries avoid a nested stable toolchain file choosing another compiler.
          Split-Path -Parent $rustc | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned evidence-reader dependencies
        run: python -m pip install Pillow==11.3.0 PyYAML==6.0.3
      - name: Check actual-loader resident reader and native orchestration guards
        env:
          PYTHONPATH: tools
        run: python -m unittest -v test_resident_authored_contract test_resident_authored_runner test_resident_authored_workflow test_resident_encode_detail
      - name: Fetch validated original reload companion
        uses: actions/download-artifact@v4
        with:
          name: generated-reload-runtime
          path: assets/reload
      - name: Fetch validated walk companions
        uses: actions/download-artifact@v4
        with:
          name: generated-walk-runtime
          path: assets/walk
      - name: Fetch validated ADS companions
        uses: actions/download-artifact@v4
        with:
          name: generated-ads-runtime
          path: assets/ads
      - name: Fetch validated directional companions
        uses: actions/download-artifact@v4
        with:
          name: generated-directional-runtime
          path: assets/directional
      - name: Fetch validated jump companions
        uses: actions/download-artifact@v4
        with:
          name: generated-jump-runtime
          path: assets/jump
      - name: Verify and materialize the original public companion set
        run: |
          New-Item -ItemType Directory -Force evidence/resident-authored | Out-Null
          python tools/package_game.py materialize --root . --include-walk --include-ads --include-directional --include-jump --require-generated > evidence/resident-authored/materialize.json
          if ($LASTEXITCODE -ne 0) { throw 'Original companion verification failed' }
      - name: Build and compare actual CPU loader versus resident GPU shader
        timeout-minutes: 38
        run: >-
          python tools/run_resident_authored_contract.py --root .
          --output evidence/resident-authored --build-timeout 1200 --process-timeout 900
      - name: Retain complete original source, process, corner and image evidence
        id: authored_resident_all
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resident-authored-attempt-${{ github.run_attempt }}
          path: |
            evidence/resident-authored/**
            !evidence/resident-authored/target/**
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - name: Retain compact reports and original images
        id: authored_resident_reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resident-authored-reports-attempt-${{ github.run_attempt }}
          path: |
            evidence/resident-authored/*.json
            evidence/resident-authored/build/**
            evidence/resident-authored/process/**
            evidence/resident-authored/captures/*.json
            evidence/resident-authored/captures/*.png
          if-no-files-found: warn
          retention-days: 7
      - name: Retain original CPU corner streams separately
        id: authored_resident_cpu_corners
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resident-authored-cpu-corners-attempt-${{ github.run_attempt }}
          path: evidence/resident-authored/captures/*-cpu.corners.bin
          if-no-files-found: warn
          retention-days: 7
      - name: Retain resident CPU-reference corner streams separately
        id: authored_resident_gpu_corners
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resident-authored-gpu-corners-attempt-${{ github.run_attempt }}
          path: evidence/resident-authored/captures/*-resident.corners.bin
          if-no-files-found: warn
          retention-days: 7
