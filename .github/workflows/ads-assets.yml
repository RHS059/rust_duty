name: Export authored ADS through FBX
on:
  workflow_call:
permissions:
  contents: read
jobs:
  export:
    name: Authored ADS to preserved47 runtime pack
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Consume this run's verified walk44 baseline
        uses: actions/download-artifact@v4
        with:
          name: generated-walk-runtime
          path: assets/walk
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Fingerprint exact Rust compiler
        id: rust-version
        shell: bash
        run: python -c "import hashlib,subprocess; print('hash='+hashlib.sha256(subprocess.check_output(['rustc','-Vv'])).hexdigest())" >> "$GITHUB_OUTPUT"
      - name: Reuse only exact-input validated ADS output
        id: asset-cache
        uses: actions/cache@v4
        with:
          path: build-ads/runtime
          key: ads-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-version.outputs.hash }}-${{ hashFiles('assets/authoring/ads/**', 'assets/walk/**', 'assets/authoring/locomotion/source_integrity.py', 'assets/locomotion/manifest.json', 'assets/locomotion/asset.vra', 'assets/locomotion/asset.vrm', 'assets/locomotion/asset.vrs.gz', 'tools/build_ads_assets.py', 'tools/export_ads_fbx.py', 'tools/package_game.py', 'tools/check_generated_assets.py', 'tools/import_fbx_viewmodel.py', 'tools/merge_walk_clip.py', 'tools/verify_locomotion_fbx.py', 'tools/vr*.py', 'tools/requirements-assets.txt', 'src/viewmodel_animation.rs', 'src/skinned_asset.rs', 'src/asset.rs', 'examples/sample_viewmodel_clip.rs', 'Cargo.toml', 'Cargo.lock', 'build.rs', '.github/actions/setup-blender/action.yml', '.github/workflows/ads-assets.yml') }}
      - name: Install pinned asset toolchain on cache miss
        if: steps.asset-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup-blender
      - name: Build actual game CPU sampler
        if: steps.asset-cache.outputs.cache-hit != 'true'
        run: cargo build --locked --release --no-default-features --example sample_viewmodel_clip
      - name: Export authoring source, convert ADS, preserve44 and verify Rust parity
        if: steps.asset-cache.outputs.cache-hit != 'true'
        run: python tools/build_ads_assets.py --blender blender --sampler target/release/examples/sample_viewmodel_clip --work build-ads/work --output build-ads/runtime
      - name: Revalidate source, old clip bytes and generated companions
        run: python tools/check_generated_assets.py --kind ads --directory build-ads/runtime
      - name: Archive this attempt - Upload ADS source and parity evidence
        if: always()
        id: archive_attempt_1
        uses: actions/upload-artifact@v4
        with:
          name: ads-export-diagnostics-attempt-${{ github.run_attempt }}
          path: build-ads/runtime/*.json
          if-no-files-found: warn
      - name: Upload ADS source and parity evidence
        if: ${{ (always()) && steps.archive_attempt_1.outcome == 'success' && steps.archive_attempt_1.outputs.artifact-id != '' }}
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: ads-export-diagnostics
          path: build-ads/runtime/*.json
          if-no-files-found: warn
      - name: Archive this attempt - Publish verified ADS companions for complete game builds
        id: archive_attempt_2
        uses: actions/upload-artifact@v4
        with:
          name: generated-ads-runtime-attempt-${{ github.run_attempt }}
          path: |
            build-ads/runtime/asset.vra
            build-ads/runtime/asset.vrs
            build-ads/runtime/asset.vrm
            build-ads/runtime/asset.vrs.gz
            build-ads/runtime/asset.vra.gz
            build-ads/runtime/*.json
          if-no-files-found: error
      - name: Publish verified ADS companions for complete game builds
        if: ${{ (success()) && steps.archive_attempt_2.outcome == 'success' && steps.archive_attempt_2.outputs.artifact-id != '' }}
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: generated-ads-runtime
          path: |
            build-ads/runtime/asset.vra
            build-ads/runtime/asset.vrs
            build-ads/runtime/asset.vrm
            build-ads/runtime/asset.vrs.gz
            build-ads/runtime/asset.vra.gz
            build-ads/runtime/*.json
          if-no-files-found: error
