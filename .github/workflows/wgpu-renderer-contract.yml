name: Independent DX12 renderer contract
on:
  workflow_call:
permissions:
  contents: read
jobs:
  renderer-contract:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PNG verification dependency
        run: python -m pip install Pillow==11.3.0
      - name: Test renderer-contract evidence guards with synthetic fixtures
        run: python -m unittest discover -s tools -p test_renderer_contract.py -v
      - name: Execute actual renderer-owned DX12 WARP fixture and verify every case
        run: >-
          python tools/run_renderer_contract.py
          --root .
          --evidence evidence/renderer-contract-run
          --output evidence/renderer-contract
          --timeout 1200
      - name: Retain this attempt's fixture reports, captures and process logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dx12-renderer-contract-attempt-${{ github.run_attempt }}
          path: |
            evidence/renderer-contract/
            evidence/renderer-contract-run/
          if-no-files-found: error
          retention-days: 7
