name: Resident ADS numerical diagnostic
on:
  push:
    branches: [aella/wgpu-1080p-diagnostics]
    paths:
      - '.github/workflows/resident-ads-rounding.yml'
      - '.github/workflows/blender-assets.yml'
      - '.github/workflows/walk-assets.yml'
      - '.github/workflows/ads-assets.yml'
      - '.github/workflows/directional-assets.yml'
      - '.github/workflows/jump-assets.yml'
      - 'examples/renderer_contract.rs'
      - 'examples/pass_submission_benchmark.rs'
      - 'examples/gpu_session_contract.rs'
      - 'examples/authored_loader_contract.rs'
      - 'examples/resident_authored_contract.rs'
      - 'assets/**'
      - 'tools/**'
      - 'src/**'
      - 'updater/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - 'build_number.rs'
      - 'rust-toolchain.toml'
      - 'rust-toolchain'
      - '.cargo/**'
      - '.gitattributes'
      - 'LICENSE'
      - 'THIRD_PARTY_LICENSES.txt'
permissions:
  contents: read
concurrency:
  group: resident-ads-rounding-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: 'false'
jobs:
  admission:
    if: github.repository == 'RHS059/rust_duty' && github.ref == 'refs/heads/aella/wgpu-1080p-diagnostics'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      admitted: ${{ steps.source.outputs.admitted }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/assets/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned reader import dependencies
        run: python -m pip install Pillow==11.3.0 PyYAML==6.0.3
      - name: Admit only the exact reviewed production source
        id: source
        shell: bash
        run: python tools/run_resident_ads_rounding.py --root . --admit >> "$GITHUB_OUTPUT"
  animation-assets:
    needs: [admission]
    if: needs.admission.outputs.admitted == 'true'
    uses: ./.github/workflows/blender-assets.yml
  walk-assets:
    needs: [admission]
    if: needs.admission.outputs.admitted == 'true'
    uses: ./.github/workflows/walk-assets.yml
  directional-assets:
    if: needs.admission.outputs.admitted == 'true'
    needs: [admission, walk-assets]
    uses: ./.github/workflows/directional-assets.yml
  ads-assets:
    if: needs.admission.outputs.admitted == 'true'
    needs: [admission, walk-assets]
    uses: ./.github/workflows/ads-assets.yml
  jump-assets:
    if: needs.admission.outputs.admitted == 'true'
    needs: [admission, walk-assets]
    uses: ./.github/workflows/jump-assets.yml
  resident-ads:
    needs: [admission, animation-assets, walk-assets, ads-assets, directional-assets, jump-assets]
    if: needs.admission.outputs.admitted == 'true' && github.repository == 'RHS059/rust_duty' && github.ref == 'refs/heads/aella/wgpu-1080p-diagnostics'
    runs-on: windows-latest
    env:
      CARGO_HOME: ${{ github.workspace }}/.resident-ads-cargo
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/assets/weapons/
      - name: Install and select the exact comparison compiler binaries
        shell: pwsh
        run: |
          rustup toolchain install 1.99.0-x86_64-pc-windows-msvc --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Pinned compiler installation failed' }
          $rustc = rustup which --toolchain 1.99.0-x86_64-pc-windows-msvc rustc
          if ($LASTEXITCODE -ne 0) { throw 'Pinned compiler lookup failed' }
          # Direct binaries avoid a nested stable toolchain file choosing another compiler.
          Split-Path -Parent $rustc | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned evidence-reader dependencies
        run: python -m pip install Pillow==11.3.0 PyYAML==6.0.3
      - name: Check diagnostic source, witness, retention and workflow guards
        env:
          PYTHONPATH: tools
        run: python -m unittest -v test_resident_ads_rounding test_resident_ads_rounding_runner test_resident_ads_rounding_workflow test_capture_frame_witness
      - name: Fetch validated original reload companion
        uses: actions/download-artifact@v4
        with:
          name: generated-reload-runtime
          path: assets/reload
      - name: Fetch validated walk companions
        uses: actions/download-artifact@v4
        with:
          name: generated-walk-runtime
          path: assets/walk
      - name: Fetch validated ADS companions
        uses: actions/download-artifact@v4
        with:
          name: generated-ads-runtime
          path: assets/ads
      - name: Fetch validated directional companions
        uses: actions/download-artifact@v4
        with:
          name: generated-directional-runtime
          path: assets/directional
      - name: Fetch validated jump companions
        uses: actions/download-artifact@v4
        with:
          name: generated-jump-runtime
          path: assets/jump
      - name: Verify and materialize the original public companion set
        run: |
          New-Item -ItemType Directory -Force evidence/resident-ads | Out-Null
          python tools/package_game.py materialize --root . --include-walk --include-ads --include-directional --include-jump --require-generated > evidence/resident-ads/materialize.json
          if ($LASTEXITCODE -ne 0) { throw 'Original companion verification failed' }
      - name: Capture both complete current ADS-offset sequences
        timeout-minutes: 142
        run: >-
          python tools/run_resident_ads_rounding.py --root .
          --output evidence/resident-ads
      - name: Retain original builds, sources, captures and diagnostic failures
        id: resident_ads_all
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resident-ads-all-attempt-${{ github.run_attempt }}
          path: |
            evidence/resident-ads/**
            !evidence/resident-ads/*-target/**
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - name: Retain compact diagnostic and process receipts
        id: resident_ads_reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resident-ads-reports-attempt-${{ github.run_attempt }}
          path: |
            evidence/resident-ads/*.json
            evidence/resident-ads/*.cfg
            evidence/resident-ads/*-build/**
            evidence/resident-ads/*-process/**
          if-no-files-found: warn
          retention-days: 7
