name: Updater checks and migration launcher builds
on:
  pull_request:
  push:
    branches: [main, 'aella/**']
permissions:
  contents: read
jobs:
  updater:
    name: Updater - ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: rust-duty-launcher-linux
          - os: windows-latest
            artifact: rust-duty-launcher-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cryptography
      - run: cargo fetch --manifest-path updater/Cargo.toml --locked
      - run: cargo fmt --manifest-path updater/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path updater/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path updater/Cargo.toml --locked
      - name: Stress native Windows pause and status persistence (10 serial runs)
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 5
        env:
          RUST_BACKTRACE: '1'
        run: |
          for ($Iteration = 1; $Iteration -le 10; $Iteration++) {
            Write-Host "::group::Windows pause/status stress $Iteration/10"
            cargo test --manifest-path updater/Cargo.toml --locked --lib tests::pause_resume_and_cancel_are_persisted -- --exact --nocapture --test-threads=1
            $TestExit = $LASTEXITCODE
            Write-Host "::endgroup::"
            if ($TestExit -ne 0) {
              throw "Windows pause/status stress failed on iteration $Iteration (cargo exit $TestExit)"
            }
          }
      - run: python -m unittest discover -s tools -p test_release_update.py -v
      - name: Collect actual updater dependency licenses
        run: python tools/collect_updater_licenses.py
      - name: Build standalone GitHub migration launcher
        run: cargo build --manifest-path updater/Cargo.toml --locked --release --bin rust-duty-launcher
      - name: Verify GitHub trust and stage launcher artifact
        run: python tools/package_updater.py --output updater-artifact
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: updater-artifact/
          if-no-files-found: error
# CI does not publish releases or import private game assets.
