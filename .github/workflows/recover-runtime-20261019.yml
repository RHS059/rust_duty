name: Recover preserved runtime bytes for PR77
on:
  push:
    branches: [aella/onehand-windows-inputs-20261018]
    paths:
      - '.github/workflows/recover-runtime-20261019.yml'
      - 'tools/runtime_recovery_20261019/**'
permissions:
  contents: read
concurrency:
  group: pr77-preserved-runtime-recovery
  cancel-in-progress: false
jobs:
  restore:
    if: github.repository == 'RHS059/rust_duty'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      EXPECTED_HEAD: ${{ github.sha }}
      TARGET_BRANCH: aella/onehand-windows-inputs-20261018
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Test exact-byte recovery guards
        run: python -B tools/runtime_recovery_20261019/test_restore.py
      - name: Restore owner-approved archive bytes
        run: >-
          python -B tools/runtime_recovery_20261019/restore.py
          --root "$GITHUB_WORKSPACE"
          --cache "$RUNNER_TEMP/pr77-runtime-archive"
          --expected-head "$EXPECTED_HEAD"
          --accept-approved-drive-warning
      - name: Install ordinary asset-parser dependencies
        run: python -m pip install -r tools/requirements-assets.txt
      - name: Verify unchanged binary and packaging contracts
        run: |
          python -B tools/package_game.py materialize --root . --include-walk --include-ads --include-directional --include-jump --require-generated
          python -B -c "import sys; sys.path.insert(0, 'tools'); import package_game; from pathlib import Path; print('Optional runtime files:', len(package_game.optional_runtime_files(Path('.'))))"
          python -I -B tools/onehand_windows/direct-delivery-v1/test_direct_delivery.py
          python -I -B tools/onehand_windows/direct-delivery-v1/test_direct_assets.py
      - name: Commit only the pinned runtime destinations
        env:
          RECOVERY_PUSH_TOKEN: ${{ github.token }}
        run: python -B tools/runtime_recovery_20261019/publish.py --root "$GITHUB_WORKSPACE" --expected-head "$EXPECTED_HEAD"
