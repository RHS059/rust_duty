[package]
name = "vector-range"
version = "0.1.10"
edition = "2021"
license = "MIT"
description = "Original standalone Rust movement and weapon feel laboratory"

[features]
default = ["audio"]
audio = ["macroquad/audio"]

[dependencies]
rust-duty-launcher = { path = "updater" }
macroquad = { version = "=0.4.14", default-features = false }

[dev-dependencies]
serde_json = "=1.0.151"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
